[project]
name = "spicemcp"
version = "0.5.0"
description = "LTspice MCP server with a stateful, anti-hallucination optimization layer"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
# plots only. Keep the core import-clean on a machine with neither: raw.py is stdlib
# `struct` + `math` so metrics never depend on numpy being present.
plots = ["matplotlib>=3.9", "numpy>=1.24"]
dev = ["pytest>=8", "matplotlib>=3.9", "numpy>=1.24"]

[project.scripts]
spicemcp = "spicemcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
