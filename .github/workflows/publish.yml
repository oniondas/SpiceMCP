name: publish

# Publishes to PyPI when a version tag (v1.2.3) is pushed. Uses PyPI trusted
# publishing: add this repository and workflow as a trusted publisher for the
# `spicemcp` project on pypi.org once; no token is stored.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Check the tag matches the version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}"
      - uses: pypa/gh-action-pypi-publish@release/v1
