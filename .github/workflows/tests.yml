name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        mcp: ["1"]
        include:
          - os: ubuntu-latest
            python: "3.13"
            mcp: "2"
          - os: windows-latest
            python: "3.13"
            mcp: "2"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} py${{ matrix.python }} mcp${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ngspice (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ngspice
      - name: Install SpiceMCP
        run: python -m pip install -e ".[dev]"
      - name: Use mcp 2.x
        if: matrix.mcp == '2'
        run: python -m pip install "mcp>=2,<3"
      - name: Run tests
        run: python -m pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build and check the package
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install the wheel in a clean environment and start the server
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp && /tmp/clean/bin/python -c "import spicemcp, spicemcp.server as s; print(spicemcp.__version__, len(s.mcp._tool_manager.list_tools()))"
